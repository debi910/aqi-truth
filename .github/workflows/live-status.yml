# Read-only look at the live demo Codespace: start-script log, step markers, containers, row counts. Changes nothing.
name: live-status
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "quick = skip the evidence run; probe = one fresh question; metrics = page loads and questions per day"
        default: ""
concurrency:
  group: live-status
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.CODESPACE_TOKEN }}
    steps:
      - name: Status
        run: |
          N=$(gh codespace list -R "${{ github.repository }}" --json name,state -q '.[0].name + " " + .[0].state'); echo "$N"
          case "$N" in *Available) ;; *) echo "not running"; exit 0;; esac
          timeout 420 gh codespace ssh -c "${N% *}" -- 'cd /workspaces/aqi-truth && git checkout -q -- docs/DB2_VERIFICATION.md 2>/dev/null; git pull -q --ff-only; bash deploy/live_status.sh ${{ github.event.inputs.mode }}' || true
