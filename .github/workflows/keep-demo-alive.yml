# Keeps the live demo Codespace running when it is needed, and stopped when it is not, so no laptop stays open
# and the free Codespaces hours are not wasted. The work is in deploy/keepalive_runner.sh.
#  - Judging window (WINDOW_START..WINDOW_END): one run holds the Codespace up for ~5.5 h, then starts the next run
#    itself (GitHub's own schedule fires unreliably, so it is only a backup that restarts the chain).
#  - "Run workflow" by hand: keeps it up for `minutes`, then stops it (unless the window is open).
#  - Outside the window, a scheduled run stops any Codespace left running.
# Needs a repository secret CODESPACE_TOKEN: a classic personal access token with the "codespace" scope.
name: keep-demo-alive
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Keep it up for this many minutes"
        default: "45"
      stop:
        description: "Stop the Codespace now instead"
        type: boolean
        default: false
      probe:
        description: "Also time a live question through the public port"
        type: boolean
        default: false
      until:
        description: "Keep it up until this UTC time (ISO, e.g. 2026-11-11T04:30:00Z); used by the run chain"
        default: ""
      run_minutes:
        description: "Longest single run before handing over (testing)"
        default: "330"
env:
  WINDOW_START: "2026-11-10T09:00:00Z"   # 2:30 PM IST, 10 Nov
  WINDOW_END: "2026-11-11T18:30:00Z"     # midnight IST, 11/12 Nov; off overnight, woken again at 7 AM IST on 12 Nov (Debi asked)
  REPO: ${{ github.repository }}
permissions:
  contents: write      # publish the second route's address on the 'endpoint' branch
  actions: write       # hand over to the next run in the chain
concurrency:
  group: keep-demo-alive
  cancel-in-progress: false
jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ secrets.CODESPACE_TOKEN }}
      PUB_TOKEN: ${{ github.token }}
      RUN_MINUTES: ${{ github.event.inputs.run_minutes || '330' }}
    steps:
      - uses: actions/checkout@v4
      - name: Keep up, or stop
        run: |
          now=$(date -u +%s); s=$(date -u -d "$WINDOW_START" +%s); e=$(date -u -d "$WINDOW_END" +%s)
          probe=$([ "${{ github.event.inputs.probe }}" = "true" ] && echo 1 || echo 0)
          if [ "${{ github.event.inputs.stop }}" = "true" ]; then bash deploy/keepalive_runner.sh stop
          elif [ -n "${{ github.event.inputs.until }}" ]; then
            u=$(date -u -d "${{ github.event.inputs.until }}" +%s)
            # A chain started before the window end moved still carries the old end: inside the window, run to its end.
            [ $now -le $e ] && [ $u -lt $e ] && u=$e
            bash deploy/keepalive_runner.sh keep "$u" "$probe"
          elif [ $now -ge $s ] && [ $now -le $e ]; then bash deploy/keepalive_runner.sh keep "$e" "$probe"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then bash deploy/keepalive_runner.sh keep $(( now + ${{ github.event.inputs.minutes || 45 }} * 60 )) "$probe"
          else echo "Outside the judging window: stopping anything left running."; bash deploy/keepalive_runner.sh stop; fi
